<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Navara × PLATEAU — Camera Language</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0f;font-family:system-ui,sans-serif;color:#fff}#app{position:fixed;inset:0}#app canvas{display:block}#ui{position:fixed;top:12px;left:12px;right:12px;max-width:560px;max-height:calc(100dvh - 48px);overflow:auto;padding:12px;background:rgba(10,12,20,.85);border:1px solid #ffffff30;border-radius:10px;backdrop-filter:blur(6px)}h1{font-size:16px;margin:0 0 8px}p,#status,#cam,#target{font-size:12px;line-height:1.6;margin:6px 0;overflow-wrap:anywhere}.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}button{background:#ffffff12;border:1px solid #ffffff50;border-radius:6px;padding:8px;color:white;cursor:pointer}button[aria-pressed=true]{background:#245db0}button:focus-visible{outline:2px solid #ffd28a}#cam{color:#ffd28a}#status{color:#9fd0ff}
</style>
</head>
<body>
<div id="app"></div>
<main id="ui">
<h1>CAMERA LANGUAGE / <span id="place-label">東京駅</span></h1>
<p>白モデル・夕景 17:40 JST 固定。画角だけを切り替えて比較します。</p>
<div class="row" aria-label="場所"><button data-place="tokyo" aria-pressed="false">東京駅</button><button data-place="tocho" aria-pressed="false">都庁</button></div>
<div class="row" aria-label="画角プリセット">
<button data-preset="hero" aria-pressed="false">HERO</button><button data-preset="low" aria-pressed="false">LOW ANGLE</button><button data-preset="diorama" aria-pressed="false">DIORAMA</button><button data-preset="top" aria-pressed="false">TOP-DOWN</button><button data-preset="horizon" aria-pressed="false">HORIZON</button><button data-preset="street" aria-pressed="false">STREET</button>
</div>
<button id="capture">📸 キャプチャ</button>
<div id="status" role="status">初期化中…</div><div id="target"></div><div id="cam"></div>
<p>設定は注視点、実測はカメラ自身の位置です。手動操作後はプリセットを再選択すると再現できます。場所切替は HERO に戻ります。ビジュアルは目視未検証。</p>
</main>
<script type="module" src="/src/camera.ts"></script>
</body></html>
