<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Navara × PLATEAU — 東京駅プロトタイプ</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#0a0a0f; font-family: system-ui, sans-serif; }
  #app { position:fixed; inset:0; }
  #app canvas { display:block; }
  #ui { position:fixed; left:12px; top:12px; z-index:10; background:rgba(10,12,20,.78); color:#fff;
        padding:10px 12px; border-radius:10px; backdrop-filter: blur(6px); max-width: 340px; }
  #ui h1 { font-size:14px; margin:0 0 6px; font-weight:600; }
  #ui p { font-size:12px; margin:4px 0; opacity:.85; line-height:1.5; }
  #ui .row { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  #ui button { border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#fff;
               padding:6px 10px; border-radius:8px; cursor:pointer; font-size:12px; }
  #ui button.active { background:#3b82f6; border-color:#3b82f6; }
  #status { font-size:11px; color:#9fd0ff; margin-top:8px; word-break: break-all; }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <h1>Navara × PLATEAU — 東京駅</h1>
  <p>PLATEAU 千代田区+中央区 LOD2（テクスチャなし・白モデル）／地形 Re:Earth Terrain／衛星写真 GSI seamlessphoto。太陽は atmosphere.date で制御。</p>
  <div class="row">
    <button onclick="location.search='?place=tokyo'">東京駅</button>
    <button onclick="location.search='?place=tocho'">都庁（新宿）</button>
  </div>
  <div class="row">
    <button data-time="day">昼 12:00</button>
    <button data-time="sunset">夕 17:40</button>
    <button data-time="night">夜 21:00</button>
    <button id="capture">📸 キャプチャ</button>
  </div>
  <div id="status">初期化中…</div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
