<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TERRA NAKED — Tokyo Terrain</title>
  <style>
    html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#070d12;color:#e3d8bc;font-family:system-ui,sans-serif}
    header{position:absolute;top:24px;left:24px;z-index:2;max-width:calc(100% - 48px);pointer-events:none}
    h1{font-size:20px;font-weight:400;letter-spacing:.25em;margin:0 0 8px}p{font-size:12px;line-height:1.6;margin:6px 0}
    button{pointer-events:auto;background:#101e25;color:inherit;border:1px solid #64736d;border-radius:3px;padding:9px 14px;cursor:pointer}
    #status{max-width:560px;color:#b8c3bf}
  </style>
</head>
<body>
  <div id="app"></div>
  <header>
    <h1>TERRA NAKED</h1>
    <p>TOKYO · 地形のみ · 標高 −5 → 60 m</p>
    <button id="orbit" type="button" aria-pressed="true">周回 ON</button>
    <button id="capture" type="button">📸 キャプチャ</button>
    <p id="status" role="status">初期化中</p>
  </header>
  <script type="module" src="/src/terra.ts"></script>
</body>
</html>
