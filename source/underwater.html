<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TOKYO UNDERWATER</title>
  <style>
    * { box-sizing: border-box; } body { margin: 0; background: #081820; color: #d5e9ec; font: 14px/1.6 system-ui,sans-serif; }
    #app { position: fixed; inset: 0; } #ui { position: absolute; top: 20px; left: 20px; max-width: min(540px, calc(100% - 40px)); padding: 20px; background: #081820e8; border: 1px solid #45616b; }
    h1 { font-size: 22px; letter-spacing: .15em; margin: 0; } p { margin: 8px 0; } nav, .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    a { color: #a5e6ec; } button { font: inherit; color: inherit; background: #17323d; border: 1px solid #587782; padding: 7px 12px; cursor: pointer; } button:hover, button[aria-pressed="true"] { background: #285466; } :focus-visible { outline: 2px solid #a5e6ec; outline-offset: 3px; } #status { font-size: 12px; } small { color: #acc1c9; }
  </style>
</head>
<body>
  <div id="app"></div>
  <section id="ui" aria-label="TOKYO UNDERWATER controls">
    <h1>TOKYO UNDERWATER</h1>
    <p id="place-label">東京駅</p>
    <nav aria-label="場所"><a href="?place=tokyo">東京駅</a><a href="?place=tocho">都庁</a><a href="index.html">v14 比較</a></nav>
    <div class="controls">
      <button id="lower" aria-label="水位を2m下げる">− 2m</button><button id="higher" aria-label="水位を2m上げる">＋ 2m</button>
      <button id="rise">▶ 水位上昇</button><button id="rain" aria-pressed="false">水滴 OFF</button><button id="capture">📸 キャプチャ</button>
    </div>
    <p id="status" role="status">初期化待ち</p>
    <small>概念表現であり実際の浸水シミュレーションではありません。水位は楕円体高の演出値。建物色は複数シナリオの浸水深最大値に基づき、水位とは独立です。</small>
  </section>
  <script type="module" src="/src/underwater.ts"></script>
</body>
</html>
