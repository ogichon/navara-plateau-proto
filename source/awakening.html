<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d15">
<title>TOKYO // AWAKENING</title>
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#090d15; color:#edf5f6; font-family:system-ui,sans-serif; }
  #app { position:fixed; inset:0; } #app canvas { display:block; }
  #ui { position:fixed; z-index:10; left:24px; top:24px; width:min(390px,calc(100% - 48px)); max-height:calc(100dvh - 70px); overflow:auto; padding:22px; background:rgba(9,13,21,.86); border:1px solid #b5e7ea33; backdrop-filter:blur(12px); border-radius:4px; }
  .eyebrow { font-size:10px; letter-spacing:.2em; color:#9bb3bf; margin:0 0 9px; }
  h1 { font-size:25px; letter-spacing:.04em; margin:0 0 8px; font-weight:500; }
  p { font-size:11px; line-height:1.7; color:#b6c5d1; margin:8px 0; }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin:14px 0; }
  button { cursor:pointer; border:1px solid #b5e7ea44; border-radius:3px; padding:9px 11px; color:inherit; background:#ffffff08; font:inherit; font-size:11px; }
  button:hover,button.active,button[aria-pressed="true"] { border-color:#a2f0eb; background:#91e7e51c; }
  button:focus-visible { outline:2px solid #c9fffa; outline-offset:3px; }
  button:disabled { opacity:.4; cursor:wait; }
  #awaken { width:100%; padding:13px; color:#091317; background:#b6f3e9; border-color:#b6f3e9; font-size:13px; letter-spacing:.12em; }
  #status { color:#b6f3e9; font-size:11px; line-height:1.6; border-top:1px solid #b5e7ea33; padding-top:12px; }
  @media(max-width:600px) { #ui { left:12px; top:12px; width:calc(100% - 24px); padding:14px; } h1 { font-size:21px; } }
</style>
</head>
<body>
<div id="app" aria-label="東京の3D都市シーン"></div>
<section id="ui" aria-label="AWAKENING コントロール">
  <p class="eyebrow">NAVARA × PLATEAU / EXPERIMENT 01</p>
  <h1>TOKYO // AWAKENING</h1>
  <p><span id="place-label">東京</span> — 現実の都市から、光の都市へ。</p>
  <div class="row" aria-label="場所">
    <button data-place="tokyo" disabled>東京駅</button><button data-place="tocho" disabled>都庁</button>
  </div>
  <div class="row" aria-label="アートディレクション比較">
    <button data-look="before" class="active" aria-pressed="true" disabled>Before</button>
    <button data-look="cyberpunk" disabled>Cyberpunk</button>
    <button data-look="gold" disabled>Gold Apocalypse</button>
    <button data-look="holographic" disabled>Holographic City</button>
  </div>
  <button id="awaken" disabled>▶ 覚醒 / REPLAY</button>
  <p>選択した案へ、ランドマークを起点に光が伝播。初回は Cyberpunk。比較ボタンは構図を保ち、完成状態を表示します。</p>
  <div class="row"><button id="capture" disabled>📸 キャプチャ</button></div>
  <p>PLATEAU 2023 LOD2 / GSI 航空写真 / Re:Earth 地形<br>高さ・重心による概念表現。実際の照明や災害を示しません。</p>
  <div id="status" role="status" aria-live="polite">初期化中…</div>
</section>
<script type="module" src="/src/awakening.ts"></script>
</body>
</html>
